# Runs the unit and browser tests (tests/) on every pull request.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          find admin assets scripts supabase tests -type f \\( -name '*.js' -o -name '*.mjs' \\) -print0 | xargs -0 -n1 node --check
          node --check script.js

      - name: Run tests
        run: npm test

      - name: Smoke test static page generation
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import { DEFAULT_SITE, DEFAULT_HOME_SECTIONS, DEFAULT_DISCLOSURE, DEFAULT_DISCLOSURE_SECTIONS } from './assets/cms/defaults.js'; fs.writeFileSync('/tmp/agratha-prerender.json', JSON.stringify({ home: { settings: { site: DEFAULT_SITE }, sections: DEFAULT_HOME_SECTIONS, announcements: [] }, disclosure: { settings: { disclosure: DEFAULT_DISCLOSURE }, sections: DEFAULT_DISCLOSURE_SECTIONS } }));"
          node scripts/prerender.mjs --data /tmp/agratha-prerender.json
          test -s index.html
          test -s mandatory-public-disclosure.html

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
